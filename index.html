<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vod to MD — 영상을 Markdown으로</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f6b57'/%3E%3Cpath d='M18 20v24l17-12z' fill='%23fff'/%3E%3Cpath d='M41 24h7M41 32h7M41 40h7' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#eef2f0; --panel:#fff; --field:#eef2f0; --step:#e3e9e6;
  --ink:#14201c; --sub:#4d5a55; --accent:#0f6b57; --accent-d:#0b5444; --accent-t:#d9ece6;
  --wait:#7a8782; --run:#9a5b00; --bad:#b3261e; --line:#94a69e;
  --font:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light;accent-color:var(--accent)}
::selection{background:var(--accent-t);color:var(--accent-d)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
.lede,.hint,.empty span{text-wrap:pretty}
h1,h2,.empty b{text-wrap:balance}
.st,.go,#go-t{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* title */
header{padding:44px 0 30px}
.brand{display:flex;align-items:center;gap:18px}
.brand>div:nth-child(2){min-width:0;flex:1}
.mark{width:60px;height:60px;border-radius:16px;background:var(--accent);flex:none;display:grid;place-items:center}
.mark svg{width:60px;height:60px}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.035em}
h1 span{color:var(--accent)}
.lede{margin:6px 0 0;font-size:17px;color:var(--sub)}
.top-link{white-space:nowrap;flex:none;margin-left:auto;display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--panel);padding:9px 14px;border-radius:99px;font-weight:600;font-size:14px;transition:background .15s}
.top-link:hover{background:var(--step)}
.top-acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.top-acts .top-link{margin-left:0;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:14px}
.offline{background:var(--ink);color:#fff}
.offline .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.offline[hidden]{display:none}
.offline span{flex:1}
.offline a{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:8px 16px;border-radius:99px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.offline a:hover{background:#13826a}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start;padding-bottom:32px}
.panel{background:var(--panel);border-radius:16px;padding:24px}
h2{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.sect+.sect{margin-top:18px}

textarea{width:100%;height:92px;border:0;border-radius:10px;background:var(--field);padding:13px 14px;resize:vertical;line-height:1.5;transition:box-shadow .15s}
textarea::placeholder{color:#5d6964}
textarea{caret-color:var(--accent)}
textarea.bad,textarea.bad:focus{box-shadow:0 0 0 2px var(--bad)}
.fieldmsg{margin:8px 2px 0;font-size:14px;color:var(--bad);font-weight:600}
.fieldmsg[hidden]{display:none}
.fieldmsg code{font:inherit;font-weight:500;background:#f8e4e2;border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
textarea:focus{outline:0;box-shadow:0 0 0 2px var(--accent)}

#drop{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:16px 18px;transition:background .15s,border-color .15s}
#drop:hover,#drop.on{background:var(--accent-t);border-color:var(--accent)}
#drop .ic{width:42px;height:42px;border-radius:10px;background:var(--step);display:grid;place-items:center;color:var(--accent);flex:none;transition:transform .2s}
#drop.on .ic{transform:translateY(-3px)}
#drop b{display:block;font-weight:650}
#drop small{color:var(--sub);font-size:14px}
#picked{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#picked:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--accent-t);color:var(--accent-d);border-radius:8px;padding:4px 6px 4px 10px;font-size:14px;font-weight:600}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.chip button{border:0;background:transparent;display:grid;place-items:center;width:28px;height:28px;margin:-4px 0;border-radius:6px;color:inherit}
.chip button:hover{background:rgba(15,107,87,.15)}
.chip svg{width:15px;height:15px}

.seg{display:flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--sub);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked=true]{background:var(--panel);color:var(--accent-d);box-shadow:0 1px 2px rgba(20,32,28,.14)}
.hint{margin:8px 2px 0;font-size:14px;color:var(--sub);min-height:22px}
.hint b{color:var(--ink)}
.lbl{display:block;font-size:14px;font-weight:650;margin:0 0 7px}

.sw{position:relative;display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer}
.sw+.sw{border-top:1px solid var(--step)}
.sw input{position:absolute;opacity:0}
.sw .t{flex:1}.sw .t b{display:block;font-weight:600}.sw .t small{color:var(--sub);font-size:14px}
.sw i{width:42px;height:24px;border-radius:99px;background:#7f908a;position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.gowrap{position:sticky;bottom:0;background:var(--panel);margin:18px -24px -24px;padding:14px 24px 24px;border-radius:0 0 16px 16px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:0;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:15px;font-weight:700;font-size:17px;transition:background .15s,transform .1s}
.go:hover{background:var(--accent-d)}
.go:active{transform:scale(.985)}
.go:disabled{background:#8fa89f;cursor:default}

/* queue */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qhead h2{margin:0;flex:1}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--field);border-radius:8px;padding:7px 11px;font-weight:600;font-size:14px;transition:background .15s}
.btn:hover{background:var(--step)}
.btn:disabled{opacity:.5;cursor:default}
.btn.warn{background:var(--accent-t);color:var(--accent-d)}
.btn.warn:hover{background:#c5e2d8}
.btn svg{width:16px;height:16px}
.btn.ic-only{padding:7px 8px}

#jobs{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.job{padding:14px 0}
.job+.job{border-top:1px solid var(--step)}
.row{display:flex;gap:12px;align-items:center}
.ico{width:38px;height:38px;border-radius:10px;background:var(--field);display:grid;place-items:center;flex:none;color:var(--sub)}
.job .t{flex:1;min-width:0}
.job .t b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .t small{display:block;color:var(--sub);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:650;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--wait)}
.st.running::before{background:var(--run)}.st.running{color:var(--run)}
.st.done::before{background:var(--accent)}.st.done{color:var(--accent-d)}
.st.error::before{background:var(--bad)}.st.error{color:var(--bad)}
.job .t small.err{color:var(--bad);white-space:normal}
.acts{display:flex;gap:6px}
.bar{height:5px;border-radius:5px;background:var(--step);margin:11px 0 0 50px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--run);border-radius:5px;transition:width .6s}
.bar i.ind{width:35%;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.prev{margin:12px 0 0 50px}
pre{scrollbar-width:thin;scrollbar-color:#9db4ac transparent;white-space:pre-wrap;word-break:break-word;background:var(--field);border-radius:10px;padding:16px;max-height:440px;overflow:auto;margin:0;font:15px/1.7 var(--font)}

.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:52px 20px;color:var(--sub);border:1.5px dashed #b4c2bc;border-radius:12px}
.empty svg{width:42px;height:42px;color:#9db4ac;stroke-width:1.5}
.empty b{color:var(--ink);font-size:17px}

.foot{padding-top:8px;padding-bottom:40px;text-align:center;color:var(--sub);font-size:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  header{padding:30px 0 22px}
  h1{font-size:28px}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .mark,.mark svg{width:50px;height:50px}
  .brand{gap:14px}
  .top-acts .top-link.gh{display:none}
  .lede{font-size:15px}
  .panel{padding:18px}
  .gowrap{margin:18px -18px -18px;padding:12px 18px 18px}
  .seg button{padding:8px 2px;font-size:13px}
  .qhead{flex-wrap:wrap}
  .qhead h2{flex:1 1 100%;margin-bottom:4px}
  .bar,.prev{margin-left:0}
  .row{flex-wrap:wrap}
  .job .t{flex:1 1 calc(100% - 56px)}
  .st{margin-left:50px}
  .acts{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 10 18.7l1-1"/></symbol>

<div class="offline" id="offline" hidden role="alert"><div class="wrap"><span>서버가 꺼져 있어요. 시작하면 이 화면이 자동으로 다시 연결돼요.</span><a href="vodmd://start"><svg class="i"><use href="#i-power"/></svg>서버 시작</a></div></div>
<header>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M18 20v24l17-12z" fill="#fff"/><path d="M41 24h7M41 32h7M41 40h7" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <div>
      <h1>Vod to <span>MD</span></h1>
      <p class="lede">영상 링크나 파일을 넣으면, 타임스탬프가 붙은 Markdown 스크립트로 바꿔 드려요.</p>
    </div>
    <div class="top-acts">
      <button class="top-link" id="stop" type="button" title="서버 끄기"><svg class="i"><use href="#i-power"/></svg>서버 끄기</button>
      <a class="top-link gh" href="https://github.com/byraju-hub/vod-to-md" target="_blank" rel="noopener"><svg class="i"><use href="#i-gh"/></svg>GitHub</a>
    </div>
  </div>
</div>
</header>

<main class="wrap grid">
  <section class="panel" aria-label="변환 설정">
    <div class="sect">
      <h2>유튜브 링크</h2>
      <textarea id="urls" placeholder="https://youtu.be/…&#10;한 줄에 하나씩 붙여넣으면 한꺼번에 변환해요" aria-label="유튜브 링크" aria-describedby="urlmsg"></textarea>
      <p class="fieldmsg" id="urlmsg" role="alert" hidden></p>
    </div>

    <div class="sect">
      <h2>내 PC 파일</h2>
      <button id="drop" type="button">
        <span class="ic"><svg class="i"><use href="#i-up"/></svg></span>
        <span><b>영상·오디오 파일을 끌어다 놓기</b><small>또는 클릭해서 선택 (여러 개 가능)</small></span>
      </button>
      <input id="file" type="file" multiple accept="video/*,audio/*" hidden>
      <div id="picked"></div>
    </div>

    <div class="sect">
      <span class="lbl" id="l-model">음성인식 모델</span>
      <div class="seg" id="model" role="radiogroup" aria-labelledby="l-model">
        <button type="button" role="radio" data-v="tiny">tiny</button>
        <button type="button" role="radio" data-v="base">base</button>
        <button type="button" role="radio" data-v="small" aria-checked="true">small</button>
        <button type="button" role="radio" data-v="medium">medium</button>
        <button type="button" role="radio" data-v="large-v3">large-v3</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="sect">
      <span class="lbl" id="l-lang">언어</span>
      <div class="seg" id="lang" role="radiogroup" aria-labelledby="l-lang">
        <button type="button" role="radio" data-v="" aria-checked="true">자동 감지</button>
        <button type="button" role="radio" data-v="ko">한국어</button>
        <button type="button" role="radio" data-v="en">English</button>
      </div>
    </div>

    <div class="sect">
      <label class="sw"><span class="t"><b>자막 무시하고 음성인식</b><small>유튜브 자막이 부정확할 때</small></span><input type="checkbox" id="whisper"><i></i></label>
      <label class="sw"><span class="t"><b>Claude 요약·소제목</b><small>API 키가 필요해요 (.env)</small></span><input type="checkbox" id="summ"><i></i></label>
    </div>

    <div class="gowrap"><button class="go" id="go" type="button"><span id="go-t">변환 시작</span><svg class="i"><use href="#i-arrow"/></svg></button></div>
  </section>

  <section class="panel" aria-label="변환 목록">
    <div class="qhead">
      <h2>변환 목록</h2>
      <button class="btn" id="folder" type="button" title="결과 파일이 저장되는 폴더"><svg class="i"><use href="#i-folder"/></svg>저장 폴더</button>
      <button class="btn" id="zip" type="button" disabled><svg class="i"><use href="#i-zip"/></svg>전체 ZIP</button>
      <button class="btn" id="clear" type="button" disabled><svg class="i"><use href="#i-broom"/></svg>끝난 항목 지우기</button>
    </div>
    <div id="jobs"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let files=[],opts={model:'small',lang:''};

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}

/* segmented controls */
const HINTS={
 tiny:'<b>가장 빠름</b> · 정확도 낮음. 연결 테스트용이에요.',
 base:'<b>빠름</b> · 영어 위주의 대략적인 받아쓰기에 적당해요.',
 small:'<b>기본값</b> · 영상 길이의 약 1배. 깨끗한 음성이면 무난해요.',
 medium:'<b>한국어 설교·강의 추천</b> · 약 2~3배 걸리지만 훨씬 정확해요.',
 'large-v3':'<b>최고 정확도</b> · CPU에서는 아주 오래 걸려요 (4~6배 이상).'};
function seg(id,key,after){
  const el=$(id),bs=[...el.querySelectorAll('button')];
  const pick=b=>{
    bs.forEach(x=>{x.setAttribute('aria-checked',x===b);x.tabIndex=x===b?0:-1});
    opts[key]=b.dataset.v;after&&after();
  };
  bs.forEach(x=>x.tabIndex=x.getAttribute('aria-checked')==='true'?0:-1);
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(b)});
  el.addEventListener('keydown',e=>{
    const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(!d)return;
    e.preventDefault();
    const n=bs[(bs.indexOf(document.activeElement)+d+bs.length)%bs.length];n.focus();pick(n);
  });
}
seg('model','model',()=>$('hint').innerHTML=HINTS[opts.model]);
seg('lang','lang');
$('hint').innerHTML=HINTS.small;

/* files */
const drop=$('drop'),fi=$('file');
function renderPicked(){
  $('picked').innerHTML=files.map((f,i)=>`<span class="chip"><span>${esc(f.name)}</span><button type="button" data-i="${i}" aria-label="${esc(f.name)} 빼기">${ic('x')}</button></span>`).join('');
  refreshGo();
}
$('picked').onclick=e=>{const b=e.target.closest('button');if(b){files.splice(+b.dataset.i,1);renderPicked()}};
const MEDIA=/\.(mp4|mkv|mov|avi|wmv|webm|flv|m4v|mpg|mpeg|ts|mp3|m4a|wav|flac|aac|ogg|opus|wma)$/i;
function addFiles(l){
  const all=[...l],ok=all.filter(f=>/^(video|audio)\//.test(f.type)||MEDIA.test(f.name));
  if(ok.length<all.length)toast(`영상·오디오가 아닌 파일 ${all.length-ok.length}개는 뺐어요`);
  files=files.concat(ok.filter(f=>!files.some(g=>g.name===f.name&&g.size===f.size)));renderPicked();
}
drop.onclick=()=>fi.click();
fi.onchange=()=>{addFiles(fi.files);fi.value=''};
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',x=>addFiles(x.dataTransfer.files));
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());

function urlList(){return $('urls').value.split('\n').map(s=>s.trim()).filter(Boolean)}
const isUrl=s=>/^https?:\/\//i.test(s);
function urlMsg(bad){
  const m=$('urlmsg'),t=$('urls');
  if(!bad||!bad.length){m.hidden=true;t.classList.remove('bad');t.removeAttribute('aria-invalid');return}
  m.innerHTML='링크는 <code>http://</code> 또는 <code>https://</code>로 시작해야 해요. 다시 확인해 주세요: '+bad.slice(0,3).map(b=>'<code>'+esc(b.length>60?b.slice(0,60)+'…':b)+'</code>').join(' ')+(bad.length>3?` 외 ${bad.length-3}줄`:'');
  m.hidden=false;t.classList.add('bad');t.setAttribute('aria-invalid','true');
}
function refreshGo(){
  const n=urlList().length+files.length;
  $('go-t').textContent=n?`${n}개 변환 시작`:'변환 시작';
}
$('urls').addEventListener('input',()=>{urlMsg();refreshGo()});

$('go').onclick=async()=>{
  if(!urlList().length&&!files.length){toast('링크를 붙여넣거나 파일을 올려 주세요');$('urls').focus();return}
  const bad=urlList().filter(l=>!isUrl(l));
  if(bad.length){urlMsg(bad);$('urls').focus();return}
  const fd=new FormData();
  fd.append('urls',$('urls').value);fd.append('model',opts.model);fd.append('lang',opts.lang);
  fd.append('whisper',$('whisper').checked?'1':'');fd.append('summarize',$('summ').checked?'1':'');
  files.forEach(f=>fd.append('files',f));
  $('go').disabled=true;$('go-t').textContent='보내는 중…';
  let r;try{r=await fetch('/api/submit',{method:'POST',body:fd})}catch(e){toast('서버에 연결하지 못했어요. 위쪽 안내를 확인해 주세요');$('go').disabled=false;refreshGo();return}
  if(!r.ok){const d=await r.json().catch(()=>({}));urlMsg(d.bad||[]);if(!d.bad)toast('요청을 처리하지 못했어요');$('go').disabled=false;refreshGo();return}
  $('urls').value='';files=[];renderPicked();$('go').disabled=false;refreshGo();poll();
};
$('folder').onclick=async()=>{
  let r;try{r=await fetch('/api/open-folder',{method:'POST'})}catch{r=null}
  if(r&&r.ok){const d=await r.json();toast('폴더를 열었어요: '+d.outdir)}
  else toast('폴더를 열지 못했어요. web.bat을 다시 실행해 보세요');
};
fetch('/api/info').then(r=>r.json()).then(d=>{$('folder').title='저장 위치: '+d.outdir}).catch(()=>{});
$('zip').onclick=()=>location.href='/api/zip';
$('clear').onclick=async()=>{await fetch('/api/clear',{method:'POST'});last='';poll()};
function friendly(raw){
  const r=String(raw||'');
  if(/unavailable|Private video|removed|not available/i.test(r))return '영상을 찾을 수 없어요. 비공개이거나 삭제된 영상일 수 있어요. 링크를 확인해 주세요.';
  if(/Sign in|not a bot|429|Too Many/i.test(r))return '유튜브가 잠시 요청을 막았어요. 몇 분 뒤에 다시 시도해 주세요.';
  if(/파일을 찾을 수 없/.test(r))return '파일을 찾지 못했어요. 링크라면 http로 시작하는지 확인해 주세요.';
  if(/Unsupported URL/i.test(r))return '지원하지 않는 주소예요. 유튜브 영상 링크인지 확인해 주세요.';
  if(/getaddrinfo|Network|timed out|Connection/i.test(r))return '인터넷에 연결하지 못했어요. 연결을 확인하고 다시 시도해 주세요.';
  return '변환에 실패했어요. 다시 시도해도 같다면 이 문구에 마우스를 올려 자세한 내용을 확인해 주세요.';
}

/* queue */
const LABEL={queued:'대기 중',running:'변환 중',done:'완료',error:'실패'};
const open=new Set(),cache={};let last='';
async function toggle(id){
  if(open.has(id)){open.delete(id)}else{open.add(id);if(!(id in cache))cache[id]=await (await fetch('/api/md/'+id)).text()}
  last='';await poll(true);
  document.querySelector(`[data-a=view][data-id="${id}"]`)?.focus();
}
async function retry(id){
  const r=await fetch('/api/retry/'+id,{method:'POST'}).catch(()=>null);
  if(!r||!r.ok){toast('다시 시도하지 못했어요. 링크를 다시 붙여넣어 주세요');return}
  last='';poll();
}
async function copy(id){
  if(!(id in cache))cache[id]=await (await fetch('/api/md/'+id)).text();
  try{await navigator.clipboard.writeText(cache[id]);toast('Markdown을 복사했어요')}catch{toast('복사하지 못했어요')}
}
$('jobs').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.dataset.id;
  if(b.dataset.a==='view')toggle(id);
  else if(b.dataset.a==='copy')copy(id);
  else if(b.dataset.a==='retry')retry(id);
  else if(b.dataset.a==='dl')location.href='/api/download/'+id;
};
function jobHTML(j){
  const isUrl=/^https?:/i.test(j.label||'');
  const pct=(String(j.log).match(/(\d+)%/)||[])[1];
  const bar=j.status==='running'?`<div class="bar" role="progressbar" aria-label="변환 진행률" aria-valuemin="0" aria-valuemax="100" ${pct?`aria-valuenow="${pct}"`:''}><i ${pct?`style="width:${pct}%"`:'class="ind"'}></i></div>`:'';
  const acts=j.status==='done'?`<div class="acts">
    <button class="btn ic-only" data-a="view" data-id="${j.id}" aria-label="미리보기" aria-expanded="${open.has(j.id)}" title="미리보기">${ic('eye')}</button>
    <button class="btn ic-only" data-a="copy" data-id="${j.id}" aria-label="복사" title="복사">${ic('copy')}</button>
    <button class="btn" data-a="dl" data-id="${j.id}">${ic('dl')}.md</button></div>`:'';
  const canRetry=j.status==='error'&&/^https?:/i.test(j.source||'');
  const retryBtn=canRetry?`<div class="acts"><button class="btn warn" data-a="retry" data-id="${j.id}">${ic('arrow')}다시 시도</button></div>`:'';
  const prev=open.has(j.id)&&cache[j.id]!=null?`<div class="prev"><pre>${esc(cache[j.id])}</pre></div>`:'';
  return `<div class="job"><div class="row">
    <span class="ico">${ic(isUrl?'play':'file')}</span>
    <div class="t"><b title="${esc(j.title||j.label)}">${esc(j.title||j.label)}</b>${j.status==='error'?`<small class="err" title="${esc(j.log)}">${esc(friendly(j.log))}</small>`:`<small>${esc(j.title?j.label:j.log)}</small>`}</div>
    <span class="st ${j.status}">${LABEL[j.status]}</span>${acts}${retryBtn}</div>${bar}${prev}</div>`;
}
async function poll(force){
  let js;try{js=await (await fetch('/api/jobs')).json();$('offline').hidden=true}
  catch{$('offline').hidden=false;clearTimeout(poll.t);poll.t=setTimeout(poll,3000);return}
  const sig=JSON.stringify(js)+[...open];
  if(sig!==last||force){
    last=sig;
    $('jobs').innerHTML=js.length?js.map(jobHTML).join(''):
     `<div class="empty">${ic('film')}<b>아직 변환한 영상이 없어요</b><span>링크를 붙여넣거나 파일을 올려 보세요.</span></div>`;
  }
  for(const id of [...open])if(!js.some(j=>j.id===id))open.delete(id);
  for(const id in cache)if(!js.some(j=>j.id===id))delete cache[id];
  const nrun=js.filter(j=>j.status==='running'||j.status==='queued').length;
  document.title=(nrun?`(${nrun}개 변환 중) `:'')+'Vod to MD — 영상을 Markdown으로';
  $('zip').disabled=!js.some(j=>j.status==='done');
  $('clear').disabled=!js.some(j=>j.status==='done'||j.status==='error');
  const active=js.some(j=>j.status==='queued'||j.status==='running');
  clearTimeout(poll.t);poll.t=setTimeout(poll,active?1500:5000);
}
$('stop').onclick=async()=>{
  const busy=document.querySelector('.st.running,.st.queued');
  if(busy&&!confirm('변환 중인 작업이 있어요. 그래도 서버를 끌까요?'))return;
  let r;try{r=await fetch('/api/shutdown',{method:'POST'})}catch{r=null}
  if(r&&r.ok)toast('서버를 껐어요');
  else if(r)toast('이 서버는 옛 버전이라 종료 기능이 없어요. web.bat을 다시 실행해 주세요');
  last='';setTimeout(poll,800);
};
poll();
</script>
</body>
</html>
