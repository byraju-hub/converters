<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raju's Converters — 시작</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f6b57'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M15 24h32M38 15l9 9-9 9'/%3E%3Cpath d='M49 40H17M26 31l-9 9 9 9'/%3E%3C/g%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f0;color:#14201c;font:16px/1.55 "Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif}
.card{background:#fff;border-radius:20px;padding:40px 36px;width:min(440px,calc(100% - 32px));text-align:center}
.mark{width:72px;height:72px;margin:0 auto 18px;display:block}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.035em;font-weight:800}h1 span{color:#0f6b57}
p{margin:0;color:#4d5a55}
.st{display:inline-flex;align-items:center;gap:8px;margin:22px 0 18px;font-weight:650}
.st::before{content:"";width:10px;height:10px;border-radius:50%;background:#8a958f}
.st.up::before{background:#0f6b57}.st.wait::before{background:#b36b00}
button{width:100%;border:0;border-radius:12px;background:#0f6b57;color:#fff;padding:15px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:hover{background:#0b5444}button:disabled{background:#9db4ac;cursor:default}
small{display:block;margin-top:14px;color:#4d5a55;font-size:14px}

/* ===== Liquid glass ===== */
body{background:#dcece6;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 42% at 12% 10%,#6fd3b6,transparent 70%),radial-gradient(34% 40% at 88% 16%,#8fd0f2,transparent 70%),
    radial-gradient(42% 46% at 72% 94%,#cdeea0,transparent 70%),radial-gradient(30% 36% at 4% 88%,#7ec8e8,transparent 70%);
  animation:d 30s ease-in-out infinite alternate}
@keyframes d{from{transform:scale(1)}to{transform:translate3d(2.5%,-2%,0) scale(1.07)}}
.card{background:linear-gradient(115deg,rgba(255,255,255,.5),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.22)),linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.4));
  -webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.78);
  box-shadow:0 14px 40px rgba(18,70,58,.14),inset 0 1px 1.5px rgba(255,255,255,.95)}
.mark{filter:drop-shadow(0 8px 14px rgba(15,107,87,.35))}
button{background:linear-gradient(180deg,#2fa88c,#0f6b57 60%,#0c5a4a);border:1px solid rgba(255,255,255,.28);
  box-shadow:0 12px 26px rgba(15,107,87,.38),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.16)}
button:hover{background:linear-gradient(180deg,#38b498,#127a63 60%,#0e6552)}
button:disabled{background:linear-gradient(180deg,rgba(90,160,142,.7),rgba(15,107,87,.5));box-shadow:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-transparency:reduce){.card{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.95)}}
</style></head>
<body><main class="card">
<svg class="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0f6b57"/><g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 24h32M38 15l9 9-9 9"/><path d="M49 40H17M26 31l-9 9 9 9"/></g></svg>
<h1>Raju's <span>Converters</span></h1>
<p>영상·PDF·이미지 변환기</p>
<div class="st" id="st" role="status">서버 확인 중…</div>
<button id="go" disabled>서버 시작</button>
<small>처음 누르면 브라우저가 "앱을 열까요?" 하고 물어요. "항상 허용"을 체크하세요.</small>
</main>
<script>
const BASE='http://127.0.0.1:8765/';
const st=document.getElementById('st'),go=document.getElementById('go');
let starting=false;
async function alive(){try{await fetch(BASE+'api/jobs',{mode:'no-cors',cache:'no-store'});return true}catch{return false}}
async function tick(){
  if(await alive()){st.className='st up';st.textContent='서버가 켜져 있어요';go.textContent='열기';go.disabled=false;location.href=BASE;return}
  st.className='st'+(starting?' wait':'');st.textContent=starting?'서버를 켜는 중…':'서버가 꺼져 있어요';
  go.disabled=starting;go.textContent='서버 시작';
  setTimeout(tick,starting?1000:3000);
}
go.onclick=()=>{if(go.textContent==='열기'){location.href=BASE;return}starting=true;go.disabled=true;location.href='vodmd://start';tick()};
tick();
</script></body></html>
